<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-labelledby="title desc">
  <title id="title">Time to first token in a healthy vLLM run</title>
  <desc id="desc">24 measured requests after 3 warm-ups. Minimum 19 milliseconds, mean 34 milliseconds, maximum 53 milliseconds.</desc>
  <rect width="1000" height="138" fill="#101A30"/>
  <g fill="none" stroke="#B1C3E8" stroke-width="2.4">
    <path d="M92 64H908M92 55v18M908 55v18"/>
    <path stroke="#9FBEFF" d="M452 33V54"/>
  </g>
  <circle cx="452" cy="64" r="8" fill="#9FBEFF"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="452" y="26" fill="#C2CFE6" font-size="23" font-weight="600">Mean time to first token</text>
    <text x="92" y="105" fill="#F1F5FF" font-size="23" font-weight="550">19 ms</text>
    <text x="452" y="105" fill="#9FBEFF" font-size="31" font-weight="700">34 ms</text>
    <text x="908" y="105" fill="#F1F5FF" font-size="23" font-weight="550">53 ms</text>
  </g>
</svg>
