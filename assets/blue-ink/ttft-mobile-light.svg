<svg xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 320 110" role="img" aria-labelledby="title desc">
  <title id="title">Time to first token in a healthy vLLM run</title>
  <desc id="desc">24 measured requests after 3 warm-ups. Minimum 19 milliseconds, mean 34 milliseconds, maximum 53 milliseconds.</desc>
  <rect width="320" height="110" fill="#FAFBFE"/>
  <g fill="none" stroke="#2D426C" stroke-width="1.5">
    <path d="M32 54H288M32 45v18M288 45v18"/>
    <path stroke="#234BBC" d="M144.94117647058823 29V44"/>
  </g>
  <circle cx="144.94117647058823" cy="54" r="5.5" fill="#234BBC"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="144.94117647058823" y="22" fill="#334966" font-size="17" font-weight="600">Mean time to first token</text>
    <text x="32" y="87" fill="#111E42" font-size="17" font-weight="550">19 ms</text>
    <text x="144.94117647058823" y="87" fill="#234BBC" font-size="22" font-weight="700">34 ms</text>
    <text x="288" y="87" fill="#111E42" font-size="17" font-weight="550">53 ms</text>
  </g>
</svg>
