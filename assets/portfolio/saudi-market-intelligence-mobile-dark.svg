<svg xmlns="http://www.w3.org/2000/svg" width="360" height="626" viewBox="0 0 360 626" role="img" aria-labelledby="title desc"><title id="title">Saudi Market Intelligence</title><desc id="desc">Research tools for Tadawul.</desc><style>@keyframes trace{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}.trace{stroke-dasharray:8 12;animation:trace 4.5s ease-out 1}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="360" height="626" rx="14" fill="#0D1117"/><text x="24" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#58D5F7">03</text><text x="70" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#A7B4C5">HOW IT WORKS</text><path class="trace" d="M180 211 V237" stroke="#58D5F7" stroke-width="2"/><rect x="24" y="67" width="312" height="144" rx="12" fill="#151C29" stroke="#2C384A"/><circle cx="54" cy="97" r="6" fill="#58D5F7"/><text x="73" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#F0F6FC">Collect</text><text x="44" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#A7B4C5">Market-data loaders supply</text><text x="44" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#A7B4C5">prices and technical</text><text x="44" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#A7B4C5">features.</text><path class="trace" d="M180 381 V407" stroke="#58D5F7" stroke-width="2"/><rect x="24" y="237" width="312" height="144" rx="12" fill="#151C29" stroke="#2C384A"/><circle cx="54" cy="267" r="6" fill="#B69BFF"/><text x="73" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#F0F6FC">Analyze</text><text x="44" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#A7B4C5">Python analysis and model</text><text x="44" y="340" font-family="Segoe UI,Arial,sans-serif" font-