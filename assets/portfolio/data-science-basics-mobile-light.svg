al,sans-serif" font-size="21" font-weight="400" fill="#526074">inspect how the models</text><text x="44" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526074">behave.</text><rect x="24" y="407" width="312" height="144" rx="12" fill="#FFFFFF" stroke="#CDD6E3"/><circle cx="54" cy="437" r="6" fill="#096A82"/><text x="73" y="446" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#152339">Evaluate</text><text x="44" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526074">Compare the exercise</text><text x="44" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526074">notebook with its worked</text><text x="44" y="537" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526074">solutions.</text><text x="24" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526074">SOURCE-BASED WALKTHROUGH</text></svg>
